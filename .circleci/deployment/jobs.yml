  apply-database-config:
    parameters:
      backend-appname:
        type: string
      cf-password:
        default: CF_PASSWORD_DEV
        type: env_var_name
      cf-space:
        default: tanf-dev
        type: string
      cf-username:
        default: CF_USERNAME_DEV
        type: env_var_name
    executor: docker-executor
    working_directory: ~/tdp-deploy
    steps:
      - init-cloud-dot-gov:
          cf-password: <<parameters.cf-password>>
          cf-space: <<parameters.cf-space>>
          cf-username: <<parameters.cf-username>>
      - apply-database-config:
          backend-appname: <<parameters.backend-appname>>
          cf-space: <<parameters.cf-space>>

  deploy-backend-application:
    parameters:
      backend-appname:
        type: string
      frontend-hostname:
        type: string
      cf-password:
        default: CF_PASSWORD_DEV
        type: env_var_name
      cf-space:
        default: tanf-dev
        type: string
      cf-username:
        default: CF_USERNAME_DEV
        type: env_var_name
    executor: docker-executor
    working_directory: ~/tdp-deploy
    steps:
      - init-cloud-dot-gov:
          cf-password: <<parameters.cf-password>>
          cf-space: <<parameters.cf-space>>
          cf-username: <<parameters.cf-username>>
      - deploy-backend-application:
          backend-appname: <<parameters.backend-appname>>
          frontend-hostname: <<parameters.frontend-hostname>>
          cf-space: <<parameters.cf-space>>

  deploy-celery-application:
    parameters:
      backend-appname:
        type: string
      celery-appname:
        type: string
      frontend-hostname:
        type: string
      cf-password:
        default: CF_PASSWORD_DEV
        type: env_var_name
      cf-space:
        default: tanf-dev
        type: string
      cf-username:
        default: CF_USERNAME_DEV
        type: env_var_name
    executor: docker-executor
    working_directory: ~/tdp-deploy
    steps:
      - init-cloud-dot-gov:
          cf-password: <<parameters.cf-password>>
          cf-space: <<parameters.cf-space>>
          cf-username: <<parameters.cf-username>>
      - deploy-celery-application:
          backend-appname: <<parameters.backend-appname>>
          celery-appname: <<parameters.celery-appname>>
          frontend-hostname: <<parameters.frontend-hostname>>
          cf-space: <<parameters.cf-space>>

  deploy-go-parser-application:
    parameters:
      backend-appname:
        type: string
      parser-appname:
        type: string
      cf-password:
        default: CF_PASSWORD_DEV
        type: env_var_name
      cf-space:
        default: tanf-dev
        type: string
      cf-username:
        default: CF_USERNAME_DEV
        type: env_var_name
    executor: docker-executor
    working_directory: ~/tdp-deploy
    steps:
      - init-cloud-dot-gov:
          cf-password: <<parameters.cf-password>>
          cf-space: <<parameters.cf-space>>
          cf-username: <<parameters.cf-username>>
      - deploy-go-parser-application:
          backend-appname: <<parameters.backend-appname>>
          parser-appname: <<parameters.parser-appname>>
          cf-space: <<parameters.cf-space>>

  deploy-frontend-application:
    parameters:
      environment:
        description: The environment to deploy to.
        type: enum
        enum: [ "development", "production" ]
        default: development
      backend-appname:
        type: string
      frontend-hostname:
        type: string
      cf-password:
        default: CF_PASSWORD_DEV
        type: env_var_name
      cf-space:
        default: tanf-dev
        type: string
      cf-username:
        default: CF_USERNAME_DEV
        type: env_var_name
    executor: docker-executor
    working_directory: ~/tdp-deploy
    steps:
      - init-cloud-dot-gov:
          cf-password: <<parameters.cf-password>>
          cf-space: <<parameters.cf-space>>
          cf-username: <<parameters.cf-username>>
      - deploy-frontend:
          environment: <<parameters.environment>>
          backend-appname: <<parameters.backend-appname>>
          frontend-hostname: <<parameters.frontend-hostname>>
          cf-space: <<parameters.cf-space>>

  verify-deployment:
    parameters:
      backend-appname:
        type: string
      celery-appname:
        type: string
      parser-appname:
        type: string
      frontend-hostname:
        type: string
      cf-password:
        default: CF_PASSWORD_DEV
        type: env_var_name
      cf-space:
        default: tanf-dev
        type: string
      cf-username:
        default: CF_USERNAME_DEV
        type: env_var_name
    executor: docker-executor
    working_directory: ~/tdp-deploy
    steps:
      - init-cloud-dot-gov:
          cf-password: <<parameters.cf-password>>
          cf-space: <<parameters.cf-space>>
          cf-username: <<parameters.cf-username>>
      - configure-and-verify-deployment:
          backend-appname: <<parameters.backend-appname>>
          celery-appname: <<parameters.celery-appname>>
          parser-appname: <<parameters.parser-appname>>
          frontend-hostname: <<parameters.frontend-hostname>>
          cf-space: <<parameters.cf-space>>

  deploy-infrastructure-dev:
    parameters:
      target_env:
        type: string
    executor: terraform/default
    working_directory: ~/tdp-deploy
    steps:
      - deploy-infrastructure:
                cf-app: << parameters.target_env >>

  deploy-infrastructure-staging:
    executor: terraform/default
    working_directory: ~/tdp-deploy
    steps:
      - deploy-infrastructure:
          cf-password: CF_PASSWORD_STAGING
          cf-username: CF_USERNAME_STAGING
          cf-space: tanf-staging
          tf-path: ./terraform/staging

  deploy-infrastructure-production:
    executor: terraform/default
    working_directory: ~/tdp-deploy
    steps:
      - deploy-infrastructure:
          cf-password: CF_PASSWORD_PROD
          cf-username: CF_USERNAME_PROD
          cf-space: tanf-prod
          tf-path: ./terraform/production

  deploy-project-updates-site:
    parameters:
      cf-org:
        default: CF_ORG
        type: env_var_name
      cf-space:
        default: tanf-dev
        type: string
      cf-password:
        type: env_var_name
        default: CF_PASSWORD_DEV
      cf-username:
        type: env_var_name
        default: CF_USERNAME_DEV
    executor: docker-executor
    working_directory: ~/tdp-deploy
    steps:
      - checkout
      - sudo-check
      - cf-check
      - login-cloud-dot-gov:
          cf-password: <<parameters.cf-password>>
          cf-org: <<parameters.cf-org>>
          cf-space: <<parameters.cf-space>>
          cf-username: <<parameters.cf-username>>
      - run:
          name: Deploy TDP Project Updates Site
          command: ./scripts/deploy-tdp-product-update-site.sh rolling tdp-project-updates

  enable-versioning:
    executor: machine-executor
    parameters:
      target_env:
        type: string
        default: dev
      cf-password:
        type: env_var_name
        default: CF_PASSWORD_DEV
      cf-username:
        type: env_var_name
        default: CF_USERNAME_DEV
      cf-space:
        type: string
        default: tanf-dev
    steps:
      - enable-s3-versioning:
          target_env: <<parameters.target_env>>
          cf-password: <<parameters.cf-password>>
          cf-username: <<parameters.cf-username>>
          cf-space: <<parameters.cf-space>>

  test-deployment-e2e:
    executor: machine-executor
    working_directory: ~/tdp-apps
    steps:
      - checkout
      - install-nodejs-machine
      - install-yarn-packages:
          app-dir: tdrs-frontend
      - run:
          name: Run Cypress e2e tests
          command: cd tdrs-frontend; yarn test:e2e-ci --config baseUrl="https://develop.tanfdata.acf.hhs.gov" --env cypressToken=$CYPRESS_TOKEN,apiUrl="https://develop.tanfdata.acf.hhs.gov/v1",adminUrl="https://develop.tanfdata.acf.hhs.gov/admin",basicAuthUsername=$FRONTEND_BASIC_AUTH_USERNAME,basicAuthPassword=$FRONTEND_BASIC_AUTH_PASSWORD
      - store_artifacts:
          path: tdrs-frontend/cypress/screenshots/
      - store_artifacts:
          path: tdrs-frontend/cypress/videos/

  prod-deploy-clamav:
    executor: docker-executor
    working_directory: ~/tdp-deploy
    steps:
      - clamav-cloud-dot-gov:
          backend-appname: tdp-backend-prod
          cf-password: CF_PASSWORD_PROD
          cf-space: tanf-prod
          cf-username: CF_USERNAME_PROD

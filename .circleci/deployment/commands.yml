# commands:
  init-deploy:
    steps:
      - checkout
      - sudo-check
      - cf-check

  init-cloud-dot-gov:
    parameters:
      cf-password:
        default: CF_PASSWORD_DEV
        type: env_var_name
      cf-org:
        default: CF_ORG
        type: env_var_name
      cf-space:
        default: tanf-dev
        type: string
      cf-username:
        default: CF_USERNAME_DEV
        type: env_var_name
    steps:
      - init-deploy
      - login-cloud-dot-gov:
          cf-password: <<parameters.cf-password>>
          cf-org: <<parameters.cf-org>>
          cf-space: <<parameters.cf-space>>
          cf-username: <<parameters.cf-username>>

  clamav-cloud-dot-gov:
    parameters:
      backend-appname:
        default: tdp-backend
        type: string
      cf-password:
        default: CF_PASSWORD_DEV
        type: env_var_name
      cf-org:
        default: CF_ORG
        type: env_var_name
      cf-space:
        default: tanf-dev
        type: string
      cf-username:
        default: CF_USERNAME_DEV
        type: env_var_name
    steps:
      - checkout
      - sudo-check
      - cf-check
      - login-cloud-dot-gov:
          cf-password: <<parameters.cf-password>>
          cf-org: <<parameters.cf-org>>
          cf-space: <<parameters.cf-space>>
          cf-username: <<parameters.cf-username>>
      - deploy-clamav

  apply-database-config:
    parameters:
      backend-appname:
        default: tdp-backend
        type: string
      cf-space:
        default: tanf-dev
        type: string
    steps:
      - run:
          name: Apply database config
          no_output_timeout: 1h
          command: |
            bash ./scripts/apply-database-config.sh <<parameters.backend-appname>> <<parameters.cf-space>>
      - run:
          name: Prepare shared deployment configuration
          command: bash ./scripts/prepare-deployment.sh <<parameters.backend-appname>>

  install-deploy-dependencies:
    steps:
      - run:
          name: Install deployment dependencies
          command: |
            sudo apt update
            sudo apt-get install -y wget
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.42.1/yq_linux_amd64
            chmod +x /usr/local/bin/yq

  deploy-backend-application:
    parameters:
      backend-appname:
        type: string
      frontend-hostname:
        type: string
      cf-space:
        type: string
    steps:
      - get-app-deploy-strategy:
          appname: <<parameters.backend-appname>>
      - install-deploy-dependencies
      - run:
          name: Deploy backend application
          command: |
            bash ./scripts/deploy-backend.sh \
              $DEPLOY_STRATEGY \
              <<parameters.frontend-hostname>> \
              <<parameters.backend-appname>> \
              <<parameters.cf-space>> \
              backend

  deploy-celery-application:
    parameters:
      backend-appname:
        type: string
      celery-appname:
        type: string
      frontend-hostname:
        type: string
      cf-space:
        type: string
    steps:
      - get-app-deploy-strategy:
          appname: <<parameters.celery-appname>>
      - install-deploy-dependencies
      - run:
          name: Deploy Celery application
          command: |
            bash ./scripts/deploy-backend.sh \
              $DEPLOY_STRATEGY \
              <<parameters.frontend-hostname>> \
              <<parameters.backend-appname>> \
              <<parameters.cf-space>> \
              celery

  deploy-go-parser-application:
    parameters:
      backend-appname:
        type: string
      parser-appname:
        type: string
      cf-space:
        type: string
    steps:
      - get-app-deploy-strategy:
          appname: <<parameters.parser-appname>>
      - run:
          name: Install Go
          command: ./scripts/install-go.sh
      - run:
          name: Deploy Go parser application
          command: |
            bash ./scripts/deploy-go-parser.sh \
              $DEPLOY_STRATEGY \
              <<parameters.parser-appname>> \
              <<parameters.backend-appname>> \
              <<parameters.cf-space>>

  configure-and-verify-deployment:
    parameters:
      backend-appname:
        type: string
      celery-appname:
        type: string
      parser-appname:
        type: string
      frontend-hostname:
        type: string
      cf-space:
        type: string
    steps:
      - run:
          name: Configure application networking
          command: |
            bash ./scripts/configure-application-network.sh \
              <<parameters.frontend-hostname>> \
              <<parameters.backend-appname>> \
              <<parameters.cf-space>>
      - run:
          name: Verify deployed applications
          command: |
            bash ./scripts/verify-deployment.sh \
              <<parameters.backend-appname>> \
              <<parameters.celery-appname>> \
              <<parameters.parser-appname>> \
              tdp-frontend-<<parameters.frontend-hostname>>

  deploy-clamav:
    steps:
      - run:
          name: Deploy ClamAV REST application
          command: |
            cf push clamav-rest -f tdrs-backend/manifest.clamav.yml \
              --var cf-space=tanf-prod

  deploy-frontend:
    parameters:
      environment:
        description: The environment to deploy to.
        type: enum
        enum: [ "development", "production" ]
        default: development
      backend-appname:
        default: tdp-backend
        type: string
      frontend-hostname:
        default: tdp-frontend
        type: string
# So the frontend knows what space its in for the banner.
# I am unclear if the domain is a reliable metric to make this function
# It seems like it might not be working
      cf-space:
        default: dev
        type: string
    steps:
      - install-nodejs:
          node-version: "22.13.0"
      - run:
          name: Log Node version
          command: node -v
      - install-yarn-packages:
          app-dir: tdrs-frontend
      - get-app-deploy-strategy:
          appname: tdp-frontend-<<parameters.frontend-hostname>>
      - run:
          name: Deploy frontend application
          command: |
            bash ./scripts/deploy-frontend.sh \
              $DEPLOY_STRATEGY \
              <<parameters.frontend-hostname>> \
              <<parameters.backend-appname>> \
              <<parameters.cf-space>> \
              <<parameters.environment>>

  get-app-deploy-strategy:
    parameters:
      appname:
        type: string
    steps:
      - run:
          name: Determine deploy strategy
          command: |
            # NOTE: The || true is a no-op included to suppress exit codes which
            #       would cause the step to exit early due to use of pipefail
            APP_GUID=$(cf app <<parameters.appname>> --guid || true)
            if [ "$APP_GUID" == "FAILED" ]; then
              echo "export DEPLOY_STRATEGY=initial" >> $BASH_ENV
            else
              echo "export DEPLOY_STRATEGY=rolling" >> $BASH_ENV
            fi

  deploy-infrastructure:
    parameters:
      tf-path:
        type: string
        default: ./terraform/dev
      cf-password:
        type: env_var_name
        default: CF_PASSWORD_DEV
      cf-username:
        type: env_var_name
        default: CF_USERNAME_DEV
      cf-space:
        type: string
        default: tanf-dev
      cf-org:
        type: env_var_name
        default: CF_ORG
      cf-app:
        type: string
        default: CF_APP
    steps:
      - checkout
      - sudo-check
      - cf-check
      - login-cloud-dot-gov:
          cf-password: <<parameters.cf-password>>
          cf-username: <<parameters.cf-username>>
          cf-space: <<parameters.cf-space>>
      - run:
          name: Export S3 Credentials for TFState
          command: |
            S3_CREDENTIALS=$(cf service-key tdp-tf-states tdp-tf-key | tail -n +2)
            {
              echo "access_key = \"$(echo "${S3_CREDENTIALS}" | jq -r .credentials.access_key_id)\""
              echo "secret_key = \"$(echo "${S3_CREDENTIALS}" | jq -r .credentials.secret_access_key)\""
              echo "region = \"$(echo "${S3_CREDENTIALS}" | jq -r '.credentials.region')\""
              echo "bucket = \"$(echo "${S3_CREDENTIALS}" | jq -r '.credentials.bucket')\""
            } >> ./backend_config.tfvars
      - run:
          name: Prepare Terraform Variables
          command: |
            {
              echo "cf_password = \"$<<parameters.cf-password>>\""
              echo "cf_user = \"$<<parameters.cf-username>>\""
              echo "cf_space_name = \"<<parameters.cf-space>>\""
              echo "cf_app_name = \"<<parameters.cf-app>>\""
            } >> ./variables.tfvars
      - terraform/init:
          path: <<parameters.tf-path>>
          backend_config_file: ./backend_config.tfvars
      - terraform/validate:
          path: <<parameters.tf-path>>
      - terraform/fmt:
          path: <<parameters.tf-path>>
      - terraform/plan:
          path: <<parameters.tf-path>>
          var_file: ./variables.tfvars
      - terraform/apply:
          path: <<parameters.tf-path>>
          var_file: ./variables.tfvars

  enable-s3-versioning:
    parameters:
      target_env:
        type: string
      cf-password:
        type: env_var_name
      cf-username:
        type: env_var_name
      cf-space:
        type: string
    steps:
      - checkout
      - cf-check
      - login-cloud-dot-gov:
          cf-password: <<parameters.cf-password>>
          cf-username: <<parameters.cf-username>>
          cf-space: <<parameters.cf-space>>
      - run:
          name: Ensure s3 versioning key exists
          # use cf to check if a service key exists for tdp-datafiles-dev(or prod)
          # exit 0 if it does, create it if it doesn't
          command: |
            chmod +x ./scripts/create_s3_versioning_key.sh
            ./scripts/create_s3_versioning_key.sh tdp-datafiles-<<parameters.target_env>> s3-versioning-key
      - run:
          name: Set up aws credentials
          command: |
            S3_CREDENTIALS=$(cf service-key tdp-datafiles-<<parameters.target_env>> s3-versioning-key | tail -n +2)
            aws configure set aws_access_key_id $(echo "${S3_CREDENTIALS}" | jq -r .access_key_id)
            aws configure set aws_secret_access_key $(echo "${S3_CREDENTIALS}" | jq -r .secret_access_key)
            aws configure set default.region $(echo "${S3_CREDENTIALS}" | jq -r '.region')
      - run:
          name: Enable S3 Versioning
          command: |
            S3_BUCKET_ID=cg-$(cf service tdp-datafiles-<<parameters.target_env>> --guid)
            aws s3api put-bucket-versioning --bucket ${S3_BUCKET_ID} --versioning-configuration Status=Enabled

  test-backend:
    executor: machine-executor
    steps:
      - checkout
      - docker-set-registry-owner
      - docker-compose-check
      - docker-compose-up-backend
      - run:
          name: Execute Python Linting Test
          command: |
            cd tdrs-backend
            docker-compose run --rm web bash -c "flake8 ."
      - run:
          name: Run Unit Tests And Create Code Coverage Report
          command: |
            cd tdrs-backend;
            docker-compose run --rm web bash -c "./wait_for_services.sh && pytest --cov-report=xml"
      - run:
          name: Run ETL integration tests
          command: |
            cd tdrs-backend
            mkdir -p "$HOME/.local/bin"
            sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$HOME/.local/bin"
            export PATH="$HOME/.local/bin:$PATH"
            task --version
            task backend-pytest-etl-integration
      - upload-codecov:
          component: backend
          coverage-report: ./tdrs-backend/coverage.xml

  test-frontend:
    executor: machine-executor
    working_directory: ~/tdp-apps
    steps:
      - checkout
      - install-nodejs-machine
      - install-yarn-packages:
          app-dir: tdrs-frontend
      - run:
          name: Run ESLint
          command: cd tdrs-frontend; yarn lint
      - run:
          name: Run Pa11y Accessibility Tests
          command: cd tdrs-frontend; mkdir pa11y-screenshots/; export NODE_OPTIONS=--openssl-legacy-provider; yarn test:accessibility
      - run:
          name: Run Jest Unit Tests
          command: cd tdrs-frontend; yarn test:ci
      - upload-codecov:
          component: frontend
          coverage-report: ./tdrs-frontend/coverage/lcov.info
      - store_artifacts:
          path: tdrs-frontend/pa11y-screenshots/

  test-e2e:
    executor: large-machine-executor
    working_directory: ~/tdp-apps
    steps:
      - checkout
      - docker-set-registry-owner
      - docker-compose-check
      - docker-compose-up-backend
      - run:
          name: Configure accelerated stale-submission E2E timeout
          command: |
            cd tdrs-backend
            STALE_PARSE_TIMEOUT_SECONDS=60 \
              STALE_PARSE_CHECK_INTERVAL_SECONDS=5 \
              GO_PARSER_SHADOW_MODE=false \
              docker-compose up -d --force-recreate web celery
            docker-compose exec -T celery sh -c '
              test "$STALE_PARSE_TIMEOUT_SECONDS" = 60 &&
              test "$STALE_PARSE_CHECK_INTERVAL_SECONDS" = 5 &&
              test "$GO_PARSER_SHADOW_MODE" = false
            '
      - docker-compose-up-frontend
      - install-nodejs-machine
      - install-yarn-packages:
          app-dir: tdrs-frontend
      - run:
          name: Wait for backend to become available
          command: |
            cd tdrs-backend
            docker-compose run --rm zaproxy bash -c \
              "PATH=$PATH:/home/zap/.local/bin &&
               pip install wait-for-it --break-system-packages &&
               wait-for-it --service http://web:8080 --timeout 180 -- echo \"Django is ready\""
      - run:
          name: apply the migrations
          command: |
            cd tdrs-backend
            docker-compose exec web bash -c "python manage.py makemigrations
            python manage.py migrate"
      - run:
          name: Remove existing cypress test users
          command: |
            cd tdrs-backend
            docker-compose exec web python manage.py delete_cypress_users -usernames new-cypress@teamraft.com cypress-admin@teamraft.com
            docker-compose exec web python manage.py reset_cypress_profile_editing_users --allow-non-debug
      - run:
          name: Setup cypress test data
          command: |
            cd tdrs-backend
            docker-compose exec web python manage.py loaddata cypress/users cypress/data_files cypress/regions cypress/profile_editing_regions cypress/profile_editing_users cypress/feature_flags
      - run:
          name: Verify stale-submission lifecycle processing
          command: |
            cd tdrs-backend
            # Celery can initially start before a fresh database has the
            # django-celery-beat tables. Remove the schedule created by that
            # initial default-configured beat, then restart it after migrations
            # so the accelerated interval is persisted before Cypress runs.
            docker-compose stop celery
            docker-compose exec -T web python manage.py shell -c "
            from django_celery_beat.models import PeriodicTask

            PeriodicTask.objects.filter(name='Mark Stale Data Files Stuck').delete()
            "
            celery_start_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            docker-compose start celery
            for lifecycle_probe_attempt in $(seq 1 60); do
              celery_logs="$(docker-compose logs --since "$celery_start_time" --no-color celery 2>/dev/null)"
              if [[ "$celery_logs" == *"DatabaseScheduler: Schedule changed"* ]]; then
                break
              fi
              if [ "$lifecycle_probe_attempt" -eq 60 ]; then
                docker-compose logs --no-color --tail=300 celery
                exit 1
              fi
              sleep 2
            done
            docker-compose exec -T celery python manage.py shell -c "
            from django.conf import settings
            from django_celery_beat.models import IntervalSchedule, PeriodicTask
            from tdpservice.data_files.tasks import mark_stale_files_stuck

            interval, _ = IntervalSchedule.objects.get_or_create(
                every=5,
                period=IntervalSchedule.SECONDS,
            )
            schedule = PeriodicTask.objects.get(name='Mark Stale Data Files Stuck')
            schedule.interval = interval
            schedule.crontab = None
            schedule.solar = None
            schedule.clocked = None
            schedule.enabled = True
            schedule.args = '[60]'
            schedule.save()
            result = mark_stale_files_stuck.delay(60)
            marked_count = result.get(timeout=15)
            assert isinstance(marked_count, int)
            print(
                'Lifecycle smoke task completed; '
                f'marked {marked_count} file(s); '
                f'Django timeout setting={settings.STALE_PARSE_TIMEOUT_SECONDS!r}.'
            )
            "
      - run:
          name: Run Cypress e2e tests
          command: |
            cd tdrs-frontend
            export CYPRESS_ADMIN_URL=http://localhost:3000/admin
            export CYPRESS_STUCK_TIMEOUT_TEST=true

            # Exercise lifecycle timeouts and reparsing before the upload-heavy
            # suite puts sustained load on the single parser and LocalStack.
            yarn test:e2e-ci --spec cypress/e2e/data-files/submission_lifecycle.feature

            # The timeout scenario revokes a deliberately long parser task.
            # Reset the disposable worker so that task cannot delay later specs.
            cd ../tdrs-backend
            docker-compose restart celery
            cd ../tdrs-frontend

            remaining_specs="$(find cypress/e2e -type f -name '*.feature' ! -path '*/submission_lifecycle.feature' | sort | paste -sd, -)"
            test -n "$remaining_specs"
            yarn test:e2e-ci --spec "$remaining_specs"
      - run:
          name: Show backend logs after an E2E failure
          when: on_fail
          command: |
            cd tdrs-backend
            docker-compose logs --no-color --tail=500 web celery localstack
            docker-compose exec -T web python manage.py shell -c "
            from django.conf import settings
            from django_celery_beat.models import PeriodicTask
            from django.db.models import Q
            from tdpservice.data_files.models import DataFile

            schedule = PeriodicTask.objects.get(name='Mark Stale Data Files Stuck')
            print(
                'Stale lifecycle diagnostics:',
                {
                    'django_timeout': settings.STALE_PARSE_TIMEOUT_SECONDS,
                    'schedule_args': schedule.args,
                    'schedule_enabled': schedule.enabled,
                    'schedule_last_run_at': schedule.last_run_at,
                    'schedule_total_run_count': schedule.total_run_count,
                },
            )
            files = DataFile.objects.filter(
                Q(original_filename='long_running_tanf_active_case.txt')
                | Q(original_filename__startswith='accepted_tanf_reparse_')
            )
            for data_file in files:
                summary = getattr(data_file, 'summary', None)
                print(
                    'Lifecycle DataFile:',
                    {
                        'id': data_file.id,
                        'filename': data_file.original_filename,
                        'state': data_file.state,
                        'state_changed_at': data_file.state_changed_at,
                        'parse_token': data_file.current_parse_token,
                        'summary_status': getattr(summary, 'status', None),
                    },
                )
            "
            docker-compose exec -T celery sh -c \
              "find /tmp -maxdepth 1 -type f -name '*.log' -size -5M -print -exec tail -n 200 {} \\;"
      - store_artifacts:
          path: tdrs-frontend/cypress/screenshots/
      - store_artifacts:
          path: tdrs-frontend/cypress/videos/

  test-go-parser:
    executor: machine-executor
    working_directory: ~/tdp-apps
    environment:
      DATABASE_URL: postgres://tdpuser:something_secure@localhost:5432/tdrs_test?sslmode=disable
    steps:
      - checkout
      - docker-set-registry-owner
      - docker-compose-check
      - docker-compose-up-backend
      - restore_cache:
          keys:
            - go-parser-v1-{{ checksum "tdrs-services/parser/go.sum" }}
            - go-parser-v1-
      - run:
          name: Install Go parser CI dependencies
          command: ./scripts/install-go-parser-ci-dependencies.sh
      - save_cache:
          key: go-parser-v1-{{ checksum "tdrs-services/parser/go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod
            - /home/circleci/.cache/go-build
            - /home/circleci/go/bin
      - run:
          name: Wait for Django service to become available
          command: |
            cd tdrs-backend
            docker-compose run --rm zaproxy bash -c \
              "PATH=$PATH:/home/zap/.local/bin &&
               pip install wait-for-it --break-system-packages &&
               wait-for-it --service http://web:8080 --timeout 180 -- echo \"Django is ready\""
      - run:
          name: Compile check
          command: |
            . "$BASH_ENV"
            task parser:compile-check
      - run:
          name: Lint
          command: |
            . "$BASH_ENV"
            task parser:lint
      - run:
          name: Validator compilation check
          command: |
            . "$BASH_ENV"
            task parser:validate-config
      - run:
          name: Run Go parser integration tests
          command: |
            cd tdrs-backend
            task backend-pytest-go-integration
      - run:
          name: Run Go parser tests with coverage
          command: |
            . "$BASH_ENV"
            task parser:test-all-coverage
      - run:
          name: Generate readable Go parser coverage report
          command: |
            . "$BASH_ENV"
            task parser:coverage-report
            echo ""
            echo "Go parser coverage summary"
            echo "--------------------------"
            cat tdrs-services/parser/coverage-summary.txt
      - store_artifacts:
          path: tdrs-services/parser/coverage.out
      - store_artifacts:
          path: tdrs-services/parser/coverage-summary.txt
      - store_artifacts:
          path: tdrs-services/parser/coverage.html

  secrets-check:
    executor: docker-executor
    steps:
      - checkout
      - run:
          name: "git-secrets: Scan repository for committed secrets"
          command: ./scripts/git-secrets-check.sh
      - run:
          name: "trufflehog: Scan repository for committed secrets"
          command: ./scripts/trufflehog-check.sh $CIRCLE_BRANCH

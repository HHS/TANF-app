
location ~ ^/(v1|v2|admin|static/admin|static/dist|swagger|redocs|login|oidc|auth_check|logout) {
        # TODO: Figure out how to sidestep basic auth for api clients in test environments without disabling it.
        auth_basic off;
        limit_req zone=limitreqsbyaddr burst=20 nodelay;
        resolver 169.254.0.2;
        set $backend http://{{env "BACKEND_HOST"}}.apps.internal:8080$request_uri;
        proxy_pass $backend;
        proxy_pass_header x-csrftoken;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Origin $http_origin;
        proxy_set_header   Authorization $http_authorization;

        proxy_connect_timeout 900;
        proxy_read_timeout    300;
        proxy_send_timeout    300;
        send_timeout 	      900;

        proxy_buffer_size        8k;
        proxy_buffers            4 8k;
        proxy_busy_buffers_size  16k;

        proxy_temp_file_write_size 64k;

        limit_except GET HEAD POST PATCH { deny all;
        }

        # Django owns CORS and CSP for proxied responses. Keeping this location-level
        # header prevents the frontend CSP from overriding Django's backend policy.
        add_header Vary 'Origin';
}

location /collect {
        set $faro http://{{env "BACKEND_HOST"}}.apps.internal:12346$request_uri;
        proxy_pass $faro;
        proxy_set_header   Host $host:3000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_read_timeout    300;
        proxy_send_timeout    300;
        send_timeout          900;
        proxy_buffer_size     4k;
}

location /grafana/ {
        auth_request /plg_auth_check;
        auth_request_set $auth_status $upstream_status;
        error_page 401 403 = @redirect_to_login;

        set $grafana http://grafana.apps.internal:8080$request_uri;
        proxy_pass $grafana;
        proxy_set_header   Host $host:3000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        send_timeout          900s;
        proxy_buffer_size     12k;
}

location /alerts/ {
        auth_request /plg_auth_check;
        auth_request_set $auth_status $upstream_status;
        error_page 401 403 = @redirect_to_login;

        set $alerts http://alertmanager.apps.internal:8080$request_uri;
        proxy_pass $alerts;
        proxy_set_header   Host $host:3000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_connect_timeout 300;
        proxy_read_timeout    300;
        proxy_send_timeout    300;
        send_timeout          900;
        proxy_buffer_size     4k;
}

location = /plg_auth_check {
    internal;
    set $endpoint http://{{env "BACKEND_HOST"}}.apps.internal:8080/plg_auth_check/;
    proxy_pass $endpoint$1$is_args$args;
    proxy_set_header   Host $host:3000;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   Content-Length "";
    proxy_set_header   X-Original-URI $request_uri;

    proxy_connect_timeout 300;
    proxy_read_timeout    300;
    proxy_send_timeout    300;
    send_timeout          900;
    proxy_pass_header x-csrftoken;
}

location = /help {
    return 301 /help/$is_args$args;
}

location ^~ /help/ {
    proxy_ssl_server_name on;
    proxy_ssl_name tdp-project-updates.app.cloud.gov;
    proxy_set_header Host tdp-project-updates.app.cloud.gov;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # The trailing slash removes the /help/ prefix from the upstream request.
    proxy_pass https://tdp-project-updates.app.cloud.gov/;
    proxy_intercept_errors off;
    proxy_redirect https://tdp-project-updates.app.cloud.gov/ /help/;
    proxy_redirect http://tdp-project-updates.app.cloud.gov/ /help/;
    proxy_redirect / /help/;

    limit_except GET HEAD { deny all;
    }

    # Help content includes third-party scripts and embedded instructional videos.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.highcharts.com https://stackpath.bootstrapcdn.com https://unpkg.com https://www.googletagmanager.com; script-src-elem 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.highcharts.com https://stackpath.bootstrapcdn.com https://unpkg.com https://www.googletagmanager.com; script-src-attr 'self' 'unsafe-inline'; img-src 'self' data: https://i.imgur.com https://user-images.githubusercontent.com https://www.google-analytics.com https://www.googletagmanager.com; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://www.googletagmanager.com; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.googletagmanager.com; child-src https://www.youtube.com https://www.youtube-nocookie.com; media-src 'none'; style-src 'self' 'unsafe-inline' https://stackpath.bootstrapcdn.com https://unpkg.com; style-src-elem 'self' 'unsafe-inline' https://stackpath.bootstrapcdn.com https://unpkg.com; style-src-attr 'self' 'unsafe-inline'; worker-src 'self' blob:;" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

if ($request_method ~ ^(TRACE|OPTION)$) {
			return 405;
}

location = /profile {
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
}

location = /home {
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
}

location ^~ /data-files {
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
}

location ^~ /fra-data-files {
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
}

location ^~ /feedback-reports {
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
}

location = /login {
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
}

location = / {
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
}

error_page 500 502 504 /50x.html;

error_page 404 /index.html;

location @redirect_to_login {
  return 302 /login;
}
